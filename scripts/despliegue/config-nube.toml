# Configuracion de la NUBE (proyecto rtm). Se aplica con scripts/despliegue/auth-nube.mjs (supabase config push desde una carpeta temporal).
# La contrasena de SMTP (llave de Resend) se lee del entorno en el momento: RESEND_API_KEY. Nada secreto vive en este archivo.
project_id = "rtm"

[api]
enabled = true
schemas = ["api", "omar"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "__SITE_URL__"
additional_redirect_urls = ["__SITE_URL__/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.rate_limit]
email_sent = 10
anonymous_users = 5
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 1800

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "__REMITENTE__"
sender_name = "RTM"

[auth.email.template.magic_link]
subject = "Tu enlace para entrar a RTM"
content_path = "./supabase/templates/magic_link.html"
